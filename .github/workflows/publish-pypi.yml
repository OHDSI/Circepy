name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: read

jobs:
  pypi-publish:
    name: Upload release to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ohdsi-circepy
    permissions:
      id-token: write  # IMPORTANT: mandatory for trusted publishing

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build twine wheel setuptools

      - name: Extract version from tag
        id: get_version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/v}
            echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
            echo "Building release for version: $VERSION"
          else
            echo "Not a tag push, checking for release"
          fi

      - name: Build package
        run: |
          python -m build
          ls -lh dist/

      - name: Check package
        run: |
          twine check dist/*

      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          INSTALLED_VERSION=$(python -c "from circe import __version__; print(__version__)")
          if [ "$INSTALLED_VERSION" != "${{ steps.get_version.outputs.VERSION }}" ]; then
            echo "ERROR: Version mismatch!"
            echo "Tag version: ${{ steps.get_version.outputs.VERSION }}"
            echo "Code version: $INSTALLED_VERSION"
            echo "Please update circe/__init__.py to match the tag"
            exit 1
          fi
          echo "✓ Version verification passed: $INSTALLED_VERSION"

      # Publish via Trusted Publishing (OIDC) — no token required.
      # Setup: https://pypi.org/manage/project/ohdsi-circepy/settings/publishing/
      #   Owner=OHDSI, Repo=Circepy, Workflow=publish-pypi.yml, Environment=pypi
      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

