name: basic tests

on:
  push:
    branches: [ develop, main ]   # Run on direct pushes to these branches
  pull_request:                    # Run on all PRs, including stacked feature PRs

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.10", "3.11", "3.12", "3.13", "3.14" ]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tox tox-gh-actions

      - name: Run tests with tox
        run: tox

      - name: Upload coverage to Codecov
        continue-on-error: true
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  wheel-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          pip install build wheel setuptools

      - name: Build wheel
        run: python -m build

      - name: Smoke test installed wheel
        run: |
          python -m venv /tmp/circe-wheel-smoke
          /tmp/circe-wheel-smoke/bin/pip install dist/*.whl
          /tmp/circe-wheel-smoke/bin/circe --help
          /tmp/circe-wheel-smoke/bin/python -c "import circe; print(circe.__version__)"

  prefect-compat:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Prefect runner dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[prefect,ibis-postgres]" pytest

      - name: Assert the real Prefect decorators are active
        run: |
          python -c "from circe.runner.flow import PREFECT_AVAILABLE; assert PREFECT_AVAILABLE"

      - name: Run a real Prefect flow
        env:
          PREFECT_SERVER_ALLOW_EPHEMERAL_MODE: "true"
        run: |
          pytest -q -o addopts= tests/test_runner.py::test_prefect_flow_and_task_objects_are_active

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build runner image
        run: |
          docker build -f docker/prefect/Dockerfile -t circe-cohort-runner:ci .

      - name: Import runner and Prefect from the image
        run: |
          docker run --rm --entrypoint python circe-cohort-runner:ci -c \
            "import circe; from circe.runner.flow import PREFECT_AVAILABLE; assert PREFECT_AVAILABLE; print(circe.__version__)"

      - name: Check container entrypoint help
        run: |
          docker run --rm circe-cohort-runner:ci --help
