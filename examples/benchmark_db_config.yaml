# Eunomia data source configuration
eunomia:
  description: "OHDSI Eunomia synthetic OMOP CDM dataset"
  url: "https://github.com/OHDSI/Eunomia/releases/download/v2.0.0/GimlettData_5.4.zip"
  size: "~10MB compressed, ~100MB uncompressed"
  patient_count: "~2500 patients"
  notes: |
    Synthetic OMOP CDM dataset for testing and development.
    Includes realistic OMOP structure with conditions, drugs, visits, procedures, measurements, etc.
    Ideal for benchmarking SQL generation and execution without privacy concerns.
