# CircePy OHDSI Phenotype Benchmark - Database Configuration
# This file defines database backends for running comprehensive benchmarks
# Add additional backends as needed for your infrastructure

# Primary benchmark backend (DuckDB - recommended for local development)
duckdb:
  driver: "duckdb"
  description: "DuckDB in-memory database (fast, no external dependencies)"
  connection:
    database: ":memory:"  # Use in-memory for speed, or provide file path for persistence
  cdm_schema: "main"
  vocabulary_schema: "main"
  results_schema: "main"
  data_source: "eunomia"  # Use OHDSI Eunomia synthetic OMOP CDM data
  notes: |
    DuckDB provides fast iteration for benchmark development.
    Set database to a file path (e.g., /tmp/benchmark_eunomia.duckdb) for persistence.

